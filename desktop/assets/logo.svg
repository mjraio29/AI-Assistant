<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272E"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>
  <circle cx="256" cy="230" r="230" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="107" fill="none" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="3"/>

  <!-- antenna -->
  <line x1="256" y1="120" x2="256" y2="168" stroke="url(#amber)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="108" r="15" fill="#EF4444"/>
  <circle cx="256" cy="108" r="26" fill="#EF4444" fill-opacity="0.25"/>

  <!-- head -->
  <rect x="140" y="168" width="232" height="192" rx="46" fill="#17171B" stroke="url(#amber)" stroke-width="9"/>

  <!-- eyes -->
  <circle cx="212" cy="256" r="22" fill="url(#amber)"/>
  <circle cx="300" cy="256" r="22" fill="url(#amber)"/>
  <circle cx="212" cy="256" r="34" fill="#F59E0B" fill-opacity="0.18"/>
  <circle cx="300" cy="256" r="34" fill="#F59E0B" fill-opacity="0.18"/>

  <!-- mouth grille -->
  <rect x="216" y="308" width="14" height="26" rx="5" fill="#EF4444"/>
  <rect x="249" y="308" width="14" height="26" rx="5" fill="url(#amber)"/>
  <rect x="282" y="308" width="14" height="26" rx="5" fill="#EF4444"/>
</svg>
